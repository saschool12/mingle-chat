<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>John Mingle — Random Video</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="video-page">

    <!-- TOP BAR -->
    <header class="video-header">

        <div class="video-brand">
            <div class="video-brand-icon">J</div>

            <div>
                <div class="video-brand-name">
                    John Mingle
                </div>

                <div class="video-brand-sub">
                    Random Video
                </div>
            </div>
        </div>

        <div class="video-user">

            <span id="username"></span>

            <button id="logout" type="button">
                Logout
            </button>

        </div>

    </header>


    <!-- MAIN VIDEO AREA -->
    <main class="video-layout">

        <section class="video-stage">

            <div class="video-card">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                ></video>

                <!-- Stranger info -->
                <div class="stranger-badge">

                    <span class="online-dot"></span>

                    <div>
                        <strong id="partnerName">
                            Stranger
                        </strong>

                        <small>
                            Random match
                        </small>
                    </div>

                </div>

                <!-- Connection status -->
                <div class="connection-status">

                    <span class="status-dot"></span>

                    <span id="status">
                        Connecting...
                    </span>

                </div>

                <!-- Your camera -->
                <div class="my-video">

                    <video
                        id="localVideo"
                        autoplay
                        muted
                        playsinline
                    ></video>

                    <div class="you-label">
                        You
                    </div>

                </div>

                <!-- Empty video state -->
                <div class="video-placeholder">

                    <div class="placeholder-icon">
                        ✦
                    </div>

                    <strong>
                        Finding someone...
                    </strong>

                    <span>
                        Your next conversation is loading
                    </span>

                </div>

            </div>

            <!-- CONTROLS -->
            <div class="controls">

                <button
                    id="mic"
                    type="button"
                    class="control-btn"
                    title="Microphone"
                >
                    🎤
                </button>

                <button
                    id="camera"
                    type="button"
                    class="control-btn"
                    title="Camera"
                >
                    📷
                </button>

                <button
                    id="next"
                    type="button"
                    class="next-btn"
                >
                    <span>Next</span>
                    <span>→</span>
                </button>

                <button
                    id="report"
                    type="button"
                    class="control-btn report-btn"
                    title="Report"
                >
                    🚩
                </button>

            </div>

        </section>


        <!-- CHAT PANEL -->
        <aside class="chat-panel">

            <div class="chat-header">

                <div>
                    <strong>
                        Conversation
                    </strong>

                    <span>
                        Say hello 👋
                    </span>
                </div>

                <div class="chat-online">
                    <span></span>
                    Live
                </div>

            </div>


            <div id="messages"></div>


            <form id="messageForm">

                <input
                    id="message"
                    placeholder="Type a message..."
                    autocomplete="off"
                >

                <button
                    type="submit"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </form>

        </aside>

    </main>


    <script src="app.js"></script>

</body>
</html>
